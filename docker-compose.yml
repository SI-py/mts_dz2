name: mts-dz2
services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.6.56
    environment:
      CLICKHOUSE_DB: homework
      CLICKHOUSE_USER: homework
      CLICKHOUSE_PASSWORD: homework_local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, clickhouse-client, --user, homework, --password, homework_local, --query, 'SELECT 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  cli:
    build: .
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: homework
      CLICKHOUSE_PASSWORD: homework_local
      CLICKHOUSE_DATABASE: homework
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results
    depends_on:
      clickhouse:
        condition: service_healthy
volumes:
  kafka_data:
  clickhouse_data:
