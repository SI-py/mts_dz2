name: mts-dbt
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    environment:
      CLICKHOUSE_DB: transactions_db
      CLICKHOUSE_USER: homework
      CLICKHOUSE_PASSWORD: homework_local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18124}:8123'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/01_raw.sql:/docker-entrypoint-initdb.d/01_raw.sql:ro
    healthcheck:
      test: [CMD, clickhouse-client, --user, homework, --password, homework_local, --query, 'SELECT 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  dbt:
    build: .
    environment:
      DBT_TARGET_PATH: /app/dbt/${DBT_ARTIFACTS_DIR:-target}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: homework
      CLICKHOUSE_PASSWORD: homework_local
    volumes:
      - .:/app/dbt
      - ./data:/app/data:ro
      - ../data:/app/input:ro
      - ./results:/app/results
      - ./scripts:/app/scripts:ro
    depends_on:
      clickhouse:
        condition: service_healthy
  docs:
    build: .
    command: [docs, serve, --host, '0.0.0.0', --port, '8080', --no-browser]
    environment:
      DBT_TARGET_PATH: /app/dbt/${DBT_ARTIFACTS_DIR:-target}
    ports:
      - '127.0.0.1:${DOCS_PORT:-18080}:8080'
    volumes:
      - .:/app/dbt
volumes:
  clickhouse_data:
