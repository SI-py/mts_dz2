- name: daily_metrics_include_threshold_and_exact_p95
  model: mart_daily_state_metrics
  given:
  - input: ref('stg_transactions')
    rows:
    - &id001
      transaction_date: '2024-01-01'
      state: CA
      customer_id: c1
      merchant: Store
      transaction_time: '2024-01-01 10:00:00'
      day_of_week: 1
      transaction_hour: 10
      is_large_transaction: false
      transaction_id: t1
      amount: 10
      is_fraud: 0
    - &id002
      transaction_date: '2024-01-01'
      state: CA
      customer_id: c1
      merchant: Store
      transaction_time: '2024-01-01 10:00:00'
      day_of_week: 1
      transaction_hour: 10
      is_large_transaction: true
      transaction_id: t2
      amount: 500
      is_fraud: 1
  expect:
    rows:
    - state: CA
      transaction_date: '2024-01-01'
      transaction_count: 2
      total_amount: 510
      average_amount: 255
      p95_amount: 500
      large_transaction_count: 1
      large_transaction_share: 50
- name: category_fraud_is_a_percentage
  model: mart_fraud_by_category
  given:
  - input: ref('stg_transactions')
    rows:
    - transaction_date: '2024-01-01'
      state: CA
      customer_id: c1
      merchant: Store
      transaction_time: '2024-01-01 10:00:00'
      day_of_week: 1
      transaction_hour: 10
      is_large_transaction: false
      transaction_id: t1
      amount: 10
      is_fraud: 0
      category: travel
    - transaction_date: '2024-01-01'
      state: CA
      customer_id: c1
      merchant: Store
      transaction_time: '2024-01-01 10:00:00'
      day_of_week: 1
      transaction_hour: 10
      is_large_transaction: true
      transaction_id: t2
      amount: 500
      is_fraud: 1
      category: travel
  expect:
    rows:
    - category: travel
      transaction_count: 2
      fraud_count: 1
      fraud_rate: 50
      total_amount: 510
      fraud_amount: 500
- name: customer_risk_thresholds
  model: mart_customer_risk_profile
  given:
  - input: ref('stg_transactions')
    format: sql
    fixture: customer_risk
  expect:
    rows:
    - customer_id: low
      risk_level: LOW
    - customer_id: large
      risk_level: MEDIUM
    - customer_id: medium
      risk_level: MEDIUM
    - customer_id: high_rate
      risk_level: HIGH
    - customer_id: high_count
      risk_level: HIGH
- name: hourly_zero_fraud_has_no_infinite_lift
  model: mart_hourly_fraud_pattern
  given:
  - input: ref('stg_transactions')
    rows:
    - transaction_date: '2024-01-01'
      state: CA
      customer_id: c1
      merchant: Store
      transaction_time: '2024-01-01 10:00:00'
      day_of_week: 1
      transaction_hour: 10
      is_large_transaction: false
      transaction_id: t0
      amount: 10
      is_fraud: 0
  expect:
    rows:
    - day_of_week: 1
      transaction_hour: 10
      transaction_count: 1
      fraud_count: 0
      fraud_rate: 0
      fraud_rate_lift: null
      is_elevated_risk: false
