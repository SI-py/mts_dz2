- name: state_counts_distinct_entities_and_joins_seed
  model: mart_fraud_by_state
  given:
  - input: ref('stg_transactions')
    rows:
    - *id001
    - *id002
  - input: ref('states')
    rows:
    - state_code: CA
      state_name: California
  expect:
    rows:
    - state: CA
      state_name: California
      transaction_count: 2
      fraud_count: 1
      fraud_rate: 50
      unique_customers: 1
      unique_merchants: 1
      total_amount: 510
