fraud_analytics:
  target: local
  outputs:
    local:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '18124') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'homework') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'homework_local') }}"
      schema: analytics
      secure: false
      threads: 2
      connect_timeout: 10
      send_receive_timeout: 300
